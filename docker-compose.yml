services:
  postgres:
    image: postgres:16-alpine
    container_name: valuex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tipster_db}
      POSTGRES_USER: ${POSTGRES_USER:-tipster_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong_postgres_password}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tipster_user} -d ${POSTGRES_DB:-tipster_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: valuex_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: valuex_web
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tipster_user}:${POSTGRES_PASSWORD:-strong_postgres_password}@postgres:5432/${POSTGRES_DB:-tipster_db}
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    volumes:
      - appdata:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  appdata:
